<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon.svg" />
    <link rel="manifest" href="./site.webmanifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

    <meta name="author" content="Ibad Ur Rahman" />
    <title>Ibad Ur Rahman | Computer Systems Engineer</title>
    <meta
      name="description"
      content="Portfolio of Ibad Ur Rahman, a Computer Systems Engineer, featuring projects and interests in AI/ML, Generative AI, software engineering, and computer systems."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ibad Ur Rahman" />
    <meta property="og:title" content="Ibad Ur Rahman | Computer Systems Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Ibad Ur Rahman, a Computer Systems Engineer, featuring projects and interests in AI/ML, Generative AI, software engineering, and computer systems."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ibad Ur Rahman | Computer Systems Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ibad Ur Rahman, a Computer Systems Engineer, featuring projects and interests in AI/ML, Generative AI, software engineering, and computer systems."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
